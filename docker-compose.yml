services:
  stream-media:
    build: .
    image: stream-media:dev
    container_name: stream-media

    # MEDIA_DIR se define en .env (ver .env.example).
    volumes:
      - ${MEDIA_DIR:?Definir MEDIA_DIR en .env con el directorio de videos}:/media:ro
      - ./output:/app/output
      # Solo el player viejo, no ./static entero: montar el directorio completo
      # taparia el /app/static/app que compila el stage de Node del Dockerfile.
      - ./static/player.html:/app/static/player.html:ro
      # TODO: el catalogo del ABM (SM_DB_PATH, data/media.sqlite) vive adentro
      # del contenedor y se pierde con cada `down -v` o rebuild. Cuando deje de
      # ser un prototipo: montar `- ./data:/app/data` y agregar `data/` al
      # .gitignore para no commitear el .sqlite.

    environment:
      - DEBUG=${DEBUG:-0}
      - SM_MEDIA_ROOT=/media
      - SM_CACHE_DIR=/app/output
      - SM_MAX_CACHE_SIZE=${MAX_CACHE_SIZE:-53687091200}

    ports:
      - "${PORT:-8000}:8000"

    # API FastAPI (modo por defecto).
    # Para modo CLI, descomentar y definir VIDEO en .env:
    # command:
    #   - python
    #   - "-m"
    #   - app.services.transcode
    #   - "/media/${VIDEO}"
    #   - "--serve"
    #   - "--port"
    #   - "8000"

    stop_grace_period: 10s
    restart: "no"

  # Solo el frontend de ./frontend, en modo desarrollo: Vite con hot reload, sin
  # backend ni FFmpeg. No participa de la imagen de produccion — esa la sigue
  # compilando el stage de Node del Dockerfile, que se sirve montado en la raiz.
  #
  #   docker compose up frontend        -> http://localhost:5173
  #
  # Va con profile para que un `docker compose up` pelado siga levantando solo
  # la API, como hasta ahora.
  frontend:
    image: node:22-slim
    container_name: stream-media-frontend
    profiles: ["dev"]
    working_dir: /app

    volumes:
      - ./frontend:/app
      # node_modules propio del contenedor. Los del host son binarios de
      # Windows y no corren en Linux; sin este volumen encima, el bind mount de
      # arriba se los daria igual.
      - frontend_modules:/app/node_modules

    environment:
      # El proxy de vite.config.ts. Adentro del contenedor `localhost` es este
      # contenedor, no la API: hay que nombrar al servicio. Si `stream-media` no
      # esta levantado, /api y /hls fallan y el resto del SPA anda igual.
      - SM_API_TARGET=http://stream-media:8000
      # El bind mount no propaga eventos de archivo desde Windows.
      - VITE_POLL=1

    # `npm install` y no `npm ci`: ci borra node_modules entero y ahi hay un
    # punto de montaje que no se puede desenlazar. El guard evita reinstalar en
    # cada arranque.
    command: sh -c "[ -d node_modules/.bin ] || npm install --no-audit --no-fund; exec npm run dev -- --host"

    ports:
      - "${FRONTEND_PORT:-5173}:5173"

    stop_grace_period: 5s
    restart: "no"

volumes:
  frontend_modules:
