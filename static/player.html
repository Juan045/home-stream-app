<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Media — Reproductor</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .player {
      width: 100%;
      max-width: 960px;
    }
    h1 {
      font-size: 1rem;
      font-weight: 500;
      color: #888;
      margin-bottom: 0.75rem;
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      display: block;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }
    .controls select {
      background: #222;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .controls select:disabled {
      opacity: 0.4;
      cursor: default;
    }
    #progress {
      height: 3px;
      background: #222;
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
      display: none;
    }
    #progress.visible { display: block; }
    #progress > div {
      height: 100%;
      width: 0;
      background: #4a9;
      transition: width 0.4s linear;
    }
    #status {
      font-size: 0.875rem;
      color: #888;
      min-height: 1.25rem;
    }
    #status.error { color: #e06c6c; }
  </style>
</head>
<body>
  <div class="player">
    <h1>Stream Media</h1>
    <video id="video" controls playsinline></video>
    <div id="progress"><div></div></div>
    <div class="controls">
      <select id="audio-select" disabled>
        <option value="">Audio: cargando...</option>
      </select>
      <select id="sub-select" disabled>
        <option value="">Subtitulos: cargando...</option>
      </select>
      <p id="status"></p>
    </div>
  </div>

  <script>
    const STALL_TIMEOUT_MS = 10000;
    const HEARTBEAT_MS = 30000;
    const POLL_MS = 2000;

    const video = document.getElementById("video");
    const status = document.getElementById("status");
    const progress = document.getElementById("progress");
    const progressBar = progress.firstElementChild;
    const audioSelect = document.getElementById("audio-select");
    const subSelect = document.getElementById("sub-select");

    let hls = null;
    let isLive = false;
    let stallTimer = null;
    let sessionId = null;
    let started = false;

    function setStatus(msg, isError = false) {
      status.textContent = msg;
      status.classList.toggle("error", isError);
    }

    function seekableRange() {
      const s = video.seekable;
      if (!s || !s.length) return null;
      return { start: s.start(0), end: s.end(s.length - 1) };
    }

    // Mientras el build corre la playlist es EVENT y el final todavia no
    // existe. Cuando termina pasa a VOD y se puede buscar en todo el archivo.
    video.addEventListener("seeking", () => {
      const range = seekableRange();
      if (!range) return;

      if (video.currentTime < range.start) {
        video.currentTime = range.start + 0.1;
      } else if (video.currentTime > range.end) {
        video.currentTime = Math.max(range.start, range.end - 0.5);
        if (isLive) setStatus("Esa parte todavía no se procesó.");
      }
    });

    video.addEventListener("waiting", () => {
      clearTimeout(stallTimer);
      stallTimer = setTimeout(() => {
        if (video.paused || !hls) return;
        setStatus("Trabado en " + video.currentTime.toFixed(0) + "s. Reintentando…", true);
        hls.startLoad(video.currentTime);
      }, STALL_TIMEOUT_MS);
    });

    video.addEventListener("playing", () => clearTimeout(stallTimer));

    // ─────────────────────────────────────────────────────────────
    // HLS
    // ─────────────────────────────────────────────────────────────

    function loadStream(url) {
      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          maxBufferLength: 30,
          maxBufferHole: 0.5,
          backBufferLength: 120,
          fragLoadingMaxRetry: 6,
          manifestLoadingMaxRetry: 6,
          manifestLoadingRetryDelay: 1000,
          capLevelToPlayerSize: true,
        });

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {
            setStatus("Listo. Presioná play para iniciar.");
          });
          reapplySubtitle();
        });

        // El master declara las pistas de audio como renditions: hls.js las
        // expone y el cambio es interno, sin recargar nada.
        hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, (event, data) => {
          populateAudioSelect(
            data.audioTracks.map((t, i) => ({
              value: i,
              label: t.name || t.lang || `Pista ${i + 1}`,
            })),
            hls.audioTrack,
          );
        });

        hls.on(Hls.Events.AUDIO_TRACK_SWITCHED, (event, data) => {
          audioSelect.value = String(data.id);
          setStatus("");
        });

        hls.on(Hls.Events.LEVEL_LOADED, (event, data) => {
          const live = data.details.live;
          if (live === isLive) return;
          isLive = live;
          if (!live) setStatus("Procesamiento terminado: se puede buscar en todo el video.");
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (!data.fatal) {
            console.warn("Error no fatal:", data.type, data.details);
            return;
          }
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              setStatus("Error de red (" + data.details + "). Reintentando…", true);
              hls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              setStatus("Error de media (" + data.details + "). Recuperando…", true);
              hls.recoverMediaError();
              break;
            default:
              setStatus("Error irrecuperable: " + data.details, true);
              hls.destroy();
              hls = null;
              break;
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        // Safari reproduce HLS nativo y expone las renditions en audioTracks.
        video.src = url;
        video.addEventListener("loadedmetadata", () => {
          populateNativeAudioTracks();
          setStatus("Reproduciendo (HLS nativo).");
          video.play().catch(() => {});
        }, { once: true });
        video.addEventListener("error", () => {
          setStatus("No se pudo cargar el stream.", true);
        }, { once: true });
      } else {
        setStatus("Este navegador no soporta HLS.", true);
      }
    }

    window.addEventListener("beforeunload", () => {
      if (hls) {
        hls.destroy();
        hls = null;
      }
    });

    // ─────────────────────────────────────────────────────────────
    // Audio
    // ─────────────────────────────────────────────────────────────

    function populateAudioSelect(options, current) {
      audioSelect.innerHTML = "";

      for (const option of options) {
        const opt = document.createElement("option");
        opt.value = option.value;
        opt.textContent = option.label;
        if (option.value === current) opt.selected = true;
        audioSelect.appendChild(opt);
      }

      audioSelect.disabled = options.length <= 1;
    }

    function populateNativeAudioTracks() {
      const tracks = video.audioTracks;
      if (!tracks || !tracks.length) return;

      const options = [];
      let current = 0;
      for (let i = 0; i < tracks.length; i++) {
        options.push({ value: i, label: tracks[i].label || tracks[i].language });
        if (tracks[i].enabled) current = i;
      }
      populateAudioSelect(options, current);
    }

    // Cambiar de idioma no toca el servidor ni recarga el manifest: no se
    // pierde la posicion, no hay corte y los subtitulos siguen activos.
    audioSelect.addEventListener("change", (e) => {
      const index = parseInt(e.target.value, 10);
      if (Number.isNaN(index)) return;

      if (hls) {
        hls.audioTrack = index;
      } else if (video.audioTracks) {
        for (let i = 0; i < video.audioTracks.length; i++) {
          video.audioTracks[i].enabled = i === index;
        }
      }
    });

    // ─────────────────────────────────────────────────────────────
    // Subtitulos
    // ─────────────────────────────────────────────────────────────

    function populateSubSelect(tracks) {
      subSelect.innerHTML = "";

      const off = document.createElement("option");
      off.value = "";
      off.textContent = "Desactivados";
      subSelect.appendChild(off);

      for (const t of tracks) {
        const opt = document.createElement("option");
        opt.value = t.url || "";
        opt.dataset.lang = t.language;
        opt.textContent = t.title ? `${t.language} — ${t.title}` : t.language;
        if (!t.url) opt.disabled = true;
        subSelect.appendChild(opt);
      }

      subSelect.disabled = tracks.length === 0;
      if (tracks.length === 0) {
        off.textContent = "Sin subtitulos";
      }
    }

    function applySubtitle(url, lang) {
      video.querySelectorAll("track").forEach(t => t.remove());
      if (!url) return;

      const track = document.createElement("track");
      track.kind = "subtitles";
      track.src = url;
      track.srclang = lang || "und";
      track.label = lang || "Subtitulos";
      track.default = true;
      video.appendChild(track);
      track.track.mode = "showing";
    }

    function reapplySubtitle() {
      const opt = subSelect.selectedOptions[0];
      if (opt && opt.value) {
        applySubtitle(opt.value, opt.dataset.lang);
      }
    }

    subSelect.addEventListener("change", (e) => {
      const opt = e.target.selectedOptions[0];
      applySubtitle(opt.value, opt?.dataset.lang);
    });

    // ─────────────────────────────────────────────────────────────
    // Sesion: progreso del build y heartbeat
    // ─────────────────────────────────────────────────────────────

    function showProgress(data) {
      if (data.status === "failed") {
        progress.classList.remove("visible");
        setStatus("El procesamiento falló: " + (data.error || "error desconocido"), true);
        return;
      }
      if (data.status === "ready") {
        progress.classList.remove("visible");
        return;
      }

      const pct = Math.round(data.progress * 100);
      progress.classList.add("visible");
      progressBar.style.width = pct + "%";
      setStatus(started
        ? "Procesando el resto: " + pct + "%"
        : "Preparando el video… " + pct + "%");
    }

    // Los subtitulos se extraen en paralelo con el video, asi que sus URLs van
    // apareciendo despues del primer render. Se repuebla el selector solo
    // cuando algo cambio, y sin pisar lo que el usuario haya elegido.
    let subSignature = null;

    function refreshSubtitles(tracks) {
      const signature = tracks.map(t => t.url || "").join("|");
      if (signature === subSignature) return;
      subSignature = signature;

      const elegido = subSelect.value;
      populateSubSelect(tracks);
      subSelect.value = elegido;
      if (subSelect.value !== elegido) subSelect.value = "";
    }

    async function pollSession() {
      if (!sessionId) return;
      try {
        const resp = await fetch(`/api/v1/sessions/${sessionId}`);
        if (!resp.ok) {
          setTimeout(pollSession, POLL_MS);
          return;
        }
        const data = await resp.json();
        showProgress(data);
        refreshSubtitles(data.subtitle_tracks);

        // Recién acá se pide el video: preguntamos primero si hay con qué.
        if (!started && data.playable) startPlayback(data.master_url);

        if (data.status === "processing") setTimeout(pollSession, POLL_MS);
      } catch {
        setTimeout(pollSession, POLL_MS);
      }
    }

    function startHeartbeat() {
      setInterval(() => {
        fetch(`/api/v1/heartbeat/${sessionId}`, { method: "POST" }).catch(() => {});
      }, HEARTBEAT_MS);
    }

    // ─────────────────────────────────────────────────────────────
    // Inicializacion
    // ─────────────────────────────────────────────────────────────

    // ?file=<ruta>     abre el archivo y crea la sesion
    // ?session=<id>    retoma una sesion ya creada
    // ?src=<url>       apunta directo a un master.m3u8 (modo CLI, sin API)

    function startPlayback(url) {
      started = true;
      loadStream(url);
    }

    function start(data) {
      sessionId = data.session_id;
      refreshSubtitles(data.subtitle_tracks);
      showProgress(data);
      startHeartbeat();

      // Si todavía no hay segmentos, no se pide nada: se espera al polling.
      if (data.playable) {
        startPlayback(data.master_url);
      } else {
        setStatus("Preparando el video…");
      }

      if (data.status === "processing") setTimeout(pollSession, POLL_MS);
    }

    async function initFromFile(filePath) {
      setStatus("Abriendo archivo…");
      try {
        const resp = await fetch("/api/v1/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ file_path: filePath }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
        start(data);
      } catch (err) {
        setStatus("No se pudo abrir el archivo: " + err.message, true);
      }
    }

    async function initFromSession(id) {
      setStatus("Cargando sesión…");
      try {
        const resp = await fetch(`/api/v1/sessions/${id}`);
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
        start(data);
      } catch (err) {
        setStatus("Error cargando la sesión: " + err.message, true);
      }
    }

    // Modo CLI: no hay API, pero el manifest del asset esta al lado del master.
    async function initFromSrc(url) {
      setStatus("Cargando manifest…");
      const base = url.substring(0, url.lastIndexOf("/") + 1);

      let subtitles = [];
      try {
        const resp = await fetch(base + "manifest.json");
        if (resp.ok) {
          const manifest = await resp.json();
          subtitles = (manifest.info?.subtitle_tracks || []).map(t => ({
            index: t.index,
            language: t.language,
            title: t.title,
            url: manifest.subtitles?.[t.index]
              ? base + "subs/" + manifest.subtitles[t.index]
              : null,
          }));
        }
      } catch {
        // Sin manifest se reproduce igual, solo sin subtitulos.
      }

      populateSubSelect(subtitles);
      startPlayback(url);
    }

    const params = new URLSearchParams(location.search);
    const paramFile = params.get("file");
    const paramSession = params.get("session");
    const paramSrc = params.get("src");

    if (paramFile) {
      initFromFile(paramFile);
    } else if (paramSession) {
      initFromSession(paramSession);
    } else if (paramSrc) {
      initFromSrc(paramSrc);
    } else {
      setStatus("Sin fuente configurada. Usá ?file=<ruta>, ?session=<id> o ?src=<url>.");
      populateSubSelect([]);
    }
  </script>
</body>
</html>
