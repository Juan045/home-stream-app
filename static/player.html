<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Media — Reproductor</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .player {
      width: 100%;
      max-width: 960px;
    }
    h1 {
      font-size: 1rem;
      font-weight: 500;
      color: #888;
      margin-bottom: 0.75rem;
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      display: block;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }
    .controls select {
      background: #222;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .controls select:disabled {
      opacity: 0.4;
      cursor: default;
    }
    #status {
      font-size: 0.875rem;
      color: #888;
      min-height: 1.25rem;
    }
    #status.error { color: #e06c6c; }
  </style>
</head>
<body>
  <div class="player">
    <h1>Stream Media</h1>
    <video id="video" controls playsinline></video>
    <div class="controls">
      <select id="audio-select" disabled>
        <option value="">Audio: cargando...</option>
      </select>
      <select id="sub-select" disabled>
        <option value="">Subtitulos: cargando...</option>
      </select>
      <p id="status"></p>
    </div>
  </div>

  <script>
    const STALL_TIMEOUT_MS = 10000;

    const video = document.getElementById("video");
    const status = document.getElementById("status");
    const audioSelect = document.getElementById("audio-select");
    const subSelect = document.getElementById("sub-select");
    let hls = null;
    let isLive = false;
    let stallTimer = null;
    let jobId = null;
    let switching = false;

    function setStatus(msg, isError = false) {
      status.textContent = msg;
      status.classList.toggle("error", isError);
    }

    function seekableRange() {
      const s = video.seekable;
      if (!s || !s.length) return null;
      return { start: s.start(0), end: s.end(s.length - 1) };
    }

    video.addEventListener("seeking", () => {
      const range = seekableRange();
      if (!range) return;

      if (video.currentTime < range.start) {
        video.currentTime = range.start + 0.1;
      } else if (video.currentTime > range.end) {
        video.currentTime = Math.max(range.start, range.end - 0.5);
        if (isLive) setStatus("Esa parte todavía no se procesó.");
      }
    });

    video.addEventListener("waiting", () => {
      clearTimeout(stallTimer);
      stallTimer = setTimeout(() => {
        if (video.paused || !hls) return;
        setStatus("Trabado en " + video.currentTime.toFixed(0) + "s. Reintentando…", true);
        hls.startLoad(video.currentTime);
      }, STALL_TIMEOUT_MS);
    });

    video.addEventListener("playing", () => clearTimeout(stallTimer));

    // ─────────────────────────────────────────────────────────────
    // HLS
    // ─────────────────────────────────────────────────────────────

    function loadStream(url, seekTo) {
      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          maxBufferLength: 30,
          maxBufferHole: 0.5,
          backBufferLength: 120,
          fragLoadingMaxRetry: 6,
          manifestLoadingMaxRetry: 3,
          capLevelToPlayerSize: true,
        });

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (seekTo != null && seekTo > 0) {
            video.currentTime = seekTo;
          }
          video.play().catch(() => {
            setStatus("Listo. Presioná play para iniciar.");
          });
          reapplySubtitle();
        });

        hls.on(Hls.Events.LEVEL_LOADED, (event, data) => {
          const live = data.details.live;
          if (live === isLive) return;
          isLive = live;
          setStatus(live
            ? "Procesando: la playlist sigue creciendo, el final aún no existe."
            : "Procesamiento terminado: se puede buscar en todo el video.");
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (!data.fatal) {
            console.warn("Error no fatal:", data.type, data.details);
            return;
          }
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              setStatus("Error de red (" + data.details + "). Reintentando…", true);
              hls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              setStatus("Error de media (" + data.details + "). Recuperando…", true);
              hls.recoverMediaError();
              break;
            default:
              setStatus("Error irrecuperable: " + data.details, true);
              hls.destroy();
              hls = null;
              break;
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
        video.addEventListener("loadedmetadata", () => {
          if (seekTo != null && seekTo > 0) video.currentTime = seekTo;
          setStatus("Reproduciendo (HLS nativo).");
          video.play().catch(() => {});
        }, { once: true });
        video.addEventListener("error", () => {
          setStatus("No se pudo cargar el stream.", true);
        }, { once: true });
      } else {
        setStatus("Este navegador no soporta HLS.", true);
      }
    }

    window.addEventListener("beforeunload", () => {
      if (hls) {
        hls.destroy();
        hls = null;
      }
    });

    // ─────────────────────────────────────────────────────────────
    // Subtitulos
    // ─────────────────────────────────────────────────────────────

    function populateSubSelect(tracks) {
      subSelect.innerHTML = "";

      const off = document.createElement("option");
      off.value = "";
      off.textContent = "Desactivados";
      subSelect.appendChild(off);

      for (const t of tracks) {
        const opt = document.createElement("option");
        opt.value = t.url || "";
        opt.dataset.lang = t.language;
        opt.textContent = t.title ? `${t.language} — ${t.title}` : t.language;
        if (!t.url) opt.disabled = true;
        subSelect.appendChild(opt);
      }

      subSelect.disabled = tracks.length === 0;
      if (tracks.length === 0) {
        off.textContent = "Sin subtitulos";
      }
    }

    function applySubtitle(url, lang) {
      video.querySelectorAll("track").forEach(t => t.remove());
      if (!url) return;

      const track = document.createElement("track");
      track.kind = "subtitles";
      track.src = url;
      track.srclang = lang || "und";
      track.label = lang || "Subtitulos";
      track.default = true;
      video.appendChild(track);
      track.track.mode = "showing";
    }

    function reapplySubtitle() {
      const opt = subSelect.selectedOptions[0];
      if (opt && opt.value) {
        applySubtitle(opt.value, opt.dataset.lang);
      }
    }

    subSelect.addEventListener("change", (e) => {
      const opt = e.target.selectedOptions[0];
      applySubtitle(opt.value, opt?.dataset.lang);
    });

    // ─────────────────────────────────────────────────────────────
    // Audio (modo API)
    // ─────────────────────────────────────────────────────────────

    function populateAudioSelect(tracks, currentTrack) {
      audioSelect.innerHTML = "";

      for (const t of tracks) {
        const opt = document.createElement("option");
        opt.value = t.index;
        const label = t.title
          ? `${t.language} — ${t.title}`
          : `${t.language} (${t.codec} ${t.channels}ch)`;
        opt.textContent = label;
        if (t.index === currentTrack) opt.selected = true;
        audioSelect.appendChild(opt);
      }

      audioSelect.disabled = tracks.length <= 1;
    }

    audioSelect.addEventListener("change", async (e) => {
      if (!jobId || switching) return;

      const newTrack = parseInt(e.target.value, 10);
      const savedTime = video.currentTime;

      switching = true;
      audioSelect.disabled = true;
      subSelect.disabled = true;
      setStatus("Cambiando audio…");

      try {
        const resp = await fetch(`/api/v1/jobs/${jobId}/select`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ audio_track: newTrack, timestamp: savedTime }),
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.detail || `HTTP ${resp.status}`);
        }

        const data = await resp.json();
        loadStream(data.hls_url, savedTime);
        setStatus("Audio cambiado.");
      } catch (err) {
        setStatus("Error al cambiar audio: " + err.message, true);
        console.error("Error cambiando audio:", err);
      } finally {
        switching = false;
        audioSelect.disabled = false;
        subSelect.disabled = subSelect.options.length <= 1;
      }
    });

    // ─────────────────────────────────────────────────────────────
    // Inicializacion
    // ─────────────────────────────────────────────────────────────

    // Modo CLI: ?src=<url> (sin API, subtitulos desde metadata.json)
    // Modo API: ?job=<id>  (con API, todo desde /api/v1/jobs/{id})

    function metadataUrl(src) {
      const idx = src.lastIndexOf("/");
      return src.substring(0, idx + 1) + "metadata.json";
    }

    async function loadSubtitleMeta(src) {
      try {
        const resp = await fetch(metadataUrl(src));
        if (!resp.ok) return [];
        const data = await resp.json();
        return data.subtitle_tracks || [];
      } catch {
        return [];
      }
    }

    async function initFromApi(id) {
      jobId = id;
      setStatus("Cargando informacion del job…");

      try {
        const resp = await fetch(`/api/v1/jobs/${id}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const job = await resp.json();

        populateAudioSelect(job.audio_tracks, job.current_audio_track);
        populateSubSelect(job.subtitle_tracks);
        loadStream(job.hls_url);
      } catch (err) {
        setStatus("Error cargando job: " + err.message, true);
      }
    }

    function initFromSrc(url) {
      audioSelect.innerHTML = "<option>Sin informacion</option>";
      audioSelect.disabled = true;

      setStatus("Cargando manifest…");
      loadStream(url);
      loadSubtitleMeta(url).then(tracks => populateSubSelect(tracks));
    }

    const params = new URLSearchParams(location.search);
    const paramJob = params.get("job");
    const paramSrc = params.get("src");

    if (paramJob) {
      initFromApi(paramJob);
    } else if (paramSrc) {
      initFromSrc(paramSrc);
    } else {
      setStatus("Sin fuente configurada. Usa ?job=<id> o ?src=<url>.");
      populateSubSelect([]);
    }
  </script>
</body>
</html>
