[project]
name = "stream-media"
version = "0.1.0"
description = "Servicio auto-hospedado de streaming multimedia (MVP)"
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.setuptools]
packages = ["app", "app.api", "app.models", "app.services"]
